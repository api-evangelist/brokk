name: Brokk
description: >-
  Brokk (Brokk, Inc.) builds AI tooling for large codebases. Rather than a hosted
  REST API, Brokk ships open-source developer tools centered on "bifrost" — a
  Tree-sitter-backed multi-language static-analysis engine that gives coding
  agents structured code intelligence (symbols, definitions, references, call
  graphs, usage analysis) across 12 languages. Bifrost runs as a CLI, a
  workspace-aware language server (LSP), and a stdio MCP server, and is published
  to crates.io (brokk-bifrost) and PyPI (brokk-bifrost-searchtools). The company,
  founded by Jonathan Ellis (Apache Cassandra / DataStax) and backed by Mayfield,
  also ships the core Brokk application, the brokk-cli launcher, and Agent Client
  Protocol (ACP) tooling (anvil, mjolnir).
